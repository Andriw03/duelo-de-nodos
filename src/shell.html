<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duelo de Nodos</title>
<style>
/*FONTS*/
/*CSS*/
</style>
</head>
<body class="cargando">
<!-- Íconos propios (estados y tipos). Se usan con <use href="#id">; color = currentColor. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="mk-knot" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" d="M3 8c5 0 6 8 11 8s5-6 2-7.5S9 12 8 16M21 8c-2 0-3 1-4 2.5M3 16c2 0 3-1 4-2.5"/></symbol>
  <symbol id="st-poison" viewBox="0 0 24 24"><path fill="currentColor" d="M9 2.5h6v2h-1.2v4.3l4.9 8.4A2.6 2.6 0 0 1 16.4 21H7.6a2.6 2.6 0 0 1-2.3-3.8l4.9-8.4V4.5H9z"/><circle cx="10.5" cy="16.2" r="1.6" fill="#fff" opacity=".8"/><circle cx="14" cy="13.6" r="1.1" fill="#fff" opacity=".8"/></symbol>
  <symbol id="st-para" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M3 8.5l3.5-3 3.5 3 3.5-3 3.5 3 3.5-3M3 15.5l3.5-3 3.5 3 3.5-3 3.5 3 3.5-3M3 21l3.5-3 3.5 3"/></symbol>
  <symbol id="st-sleep" viewBox="0 0 24 24"><path fill="currentColor" d="M14.5 2.5A9.5 9.5 0 1 0 21.5 16 7.7 7.7 0 0 1 14.5 2.5z"/></symbol>
  <symbol id="st-freeze" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><path d="M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5"/></g></symbol>
  <symbol id="ty-fuego" viewBox="0 0 24 24"><path fill="currentColor" d="M12.5 1.8c.8 3.9 5.5 6 5.5 11.4A6 6 0 0 1 6 13.6c0-2.6 1.3-4.2 2.6-5.3.1 2 1 3.3 2.2 3.8-.1-4 .1-7.3 1.7-10.3z"/></symbol>
  <symbol id="ty-planta" viewBox="0 0 24 24"><path fill="currentColor" d="M4 20.5C4 10.5 9.5 4.2 21 3.5c-.4 11.3-6.2 17-17 17z"/><path fill="none" stroke="#0e1322" stroke-width="1.6" stroke-linecap="round" d="M5.5 19L15 9.5" opacity=".55"/></symbol>
  <symbol id="ty-tierra" viewBox="0 0 24 24"><path fill="currentColor" d="M1.5 20.5L9 7.5l4.2 6.6 2.8-3.8 6.5 10.2z"/></symbol>
  <symbol id="ty-rayo" viewBox="0 0 24 24"><path fill="currentColor" d="M13.8 1.5L4.5 13.4h6.3l-1.9 9.1 10.6-13.1h-6.4l2.5-7.9z"/></symbol>
  <symbol id="ty-agua" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.2c3.6 5 6.4 8.3 6.4 11.6a6.4 6.4 0 0 1-12.8 0c0-3.3 2.8-6.6 6.4-11.6z"/><path fill="none" stroke="#0e1322" stroke-width="1.5" stroke-linecap="round" d="M8.6 14.6c1.1.9 2.3.9 3.4 0s2.3-.9 3.4 0" opacity=".55"/></symbol>
</svg>
<div id="app">
  <section id="scr-team" class="screen">
    <header class="tbar">
      <h1>Duelo de <span>Nodos</span></h1>
      <button type="button" id="btn-rules-t" class="btn icon" aria-label="Cómo jugar">?</button>
    </header>
    <p class="intro">Elige 6 de las 25 criaturas. La CPU arma un equipo equilibrado al azar. Toca la <b>i</b> para ver la ruleta de cada una.</p>
    <button type="button" id="btn-camp" class="btn camp-btn"><span>Campaña</span><small>El Gran Telar del Tiempo</small></button>
    <p class="about"><span id="version-t"></span><button type="button" id="btn-feedback-t" class="linkbtn" hidden>Enviar comentarios</button></p>
    <div class="diff" id="diff" role="radiogroup" aria-label="Dificultad">
      <button type="button" role="radio" data-lv="facil">Fácil</button>
      <button type="button" role="radio" data-lv="normal">Normal</button>
      <button type="button" role="radio" data-lv="dificil">Difícil</button>
    </div>
    <div id="type-strip-t" class="type-strip" aria-label="Ciclo de tipos: cada tipo vence al siguiente"></div>
    <div id="team-grid" class="grid"></div>
    <footer class="team-foot">
      <button type="button" id="btn-continue" class="btn" hidden>Continuar partida guardada</button>
      <div class="row">
        <span class="count" id="team-count">0/6</span>
        <button type="button" id="btn-random" class="btn">Al azar</button>
        <button type="button" id="btn-play" class="btn primary" disabled>Jugar</button>
      </div>
    </footer>
  </section>

  <section id="scr-camp" class="screen" hidden>
    <header class="tbar">
      <button type="button" id="btn-camp-back" class="btn icon" aria-label="Volver">‹</button>
      <h1>Campaña</h1>
      <button type="button" id="btn-camp-menu" class="btn icon" aria-label="Opciones de campaña">☰</button>
    </header>
    <div id="camp-head" class="camp-head"></div>
    <div id="camp-list" class="camp-list"></div>
  </section>

  <section id="scr-game" class="screen" hidden>
    <header class="gbar">
      <button type="button" id="btn-menu" class="btn icon" aria-label="Menú">☰</button>
      <div id="turn-pill" class="pill" aria-live="polite"></div>
      <button type="button" id="btn-rules-g" class="btn icon" aria-label="Cómo jugar">?</button>
    </header>
    <div id="guide-bar" class="guide-bar" hidden><span id="guide-title"></span><button type="button" id="btn-guide-exit" class="linkbtn">Salir</button></div>
    <div id="type-strip-g" class="type-strip" aria-label="Ciclo de tipos: cada tipo vence al siguiente"></div>
    <div id="bench-1" class="bench p1"></div>
    <div class="board-wrap"><svg id="board" role="img" aria-label="Tablero de 29 casillas"></svg></div>
    <div id="bench-0" class="bench p0"></div>
    <div class="panel">
      <div class="msg-row"><p id="msg" aria-live="polite"></p><div id="actions"></div></div>
      <div id="ficha" class="ficha empty"></div>
    </div>
  </section>
</div>

<div id="battle" class="overlay" hidden>
  <div class="battle-inner" role="dialog" aria-modal="true" aria-labelledby="battle-title">
    <h2 id="battle-title">Combate</h2>
    <div class="fighter" id="bf-top"><canvas></canvas><div class="fi"><div class="fn"></div><div class="fr"></div><div class="res"></div></div></div>
    <div class="fighter" id="bf-bot"><canvas></canvas><div class="fi"><div class="fn"></div><div class="fr"></div><div class="res"></div></div></div>
    <p id="battle-text" class="battle-text" aria-live="polite"></p>
    <button type="button" id="battle-go" class="btn primary">Continuar</button>
  </div>
</div>

<div id="dialogo" class="dialogo" hidden>
  <div class="dlg-fondo"></div>
  <div class="dlg-escena" aria-live="polite"></div>
  <div class="dlg-retrato"></div>
  <div class="dlg-caja">
    <div class="dlg-nombre"></div>
    <p class="dlg-accion"></p>
    <p class="dlg-texto"></p>
    <div class="dlg-opciones"></div>
    <div class="dlg-pie"><button type="button" class="linkbtn dlg-saltar">Saltar escena</button><span class="dlg-sigue">Toca para seguir ›</span></div>
  </div>
</div>

<div id="modal" class="overlay modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>
