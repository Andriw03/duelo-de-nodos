  /* Convierte un tablero en datos a la forma que usa el motor y lo valida.
     El orden de "edges" define el orden de vecinos (adj), que el recorrido y la IA usan para desempatar. */
  function compileBoard(j) {
    const fail = m => { throw new Error('Tablero ' + (j && j.id) + ': ' + m); };
    if (!j || !Array.isArray(j.nodes) || !j.nodes.length) fail('sin nodos');
    const N = j.nodes.length; const okId = n => Number.isInteger(n) && n >= 0 && n < N;
    const nodes = j.nodes.map((n, id) => ({ id, c: n.c, r: n.r, x: n.x, y: n.y, kind: 'n', owner: null }));
    const adj = nodes.map(() => []);
    (j.edges || []).forEach(([a, b]) => {
      if (!okId(a) || !okId(b) || a === b) fail('arista inválida ' + a + '-' + b);

      adj[a].push(b); adj[b].push(a);

    if (!Array.isArray(entries) || entries.length !== 2 || !entries.every(es => Array.isArray(es) && es.length && es.every(okId))) fail('entradas inválidas');
    goal.forEach((g, p) => { nodes[g].kind = 'goal'; nodes[g].owner = p; });
    entries.forEach((es, p) => es.forEach(e => { if (nodes[e].kind !== 'n') fail('cruce ' + e + ' usado dos veces'); nodes[e].kind = 'entry'; nodes[e].owner = p; }));
    const edges = [];
    adj.forEach((ns, a) => ns.forEach(b => { if (a < b) edges.push([a, b]); }));
    // distancias estáticas (sin ocupación)

      const d = new Array(N).fill(99); d[s] = 0; const q = [s];

    });

    // Datos para reglas de jefe (sin efecto por sí solos): cruces marcados y pares de cruces enlazados.

    links.forEach(l => { if (!okId(l.a) || !okId(l.b) || l.a === l.b) fail('enlace inválido ' + l.a + '-' + l.b); });
    return { id: j.id, name: j.nombre || j.id, nodes, adj, edges, goal, entries, dist, marked, links, width: j.width, height: j.height };
  }

  const DATA = loadData();
  const BOARDS = {};
  Object.keys(DATA.boards).forEach(id => { BOARDS[id] = compileBoard(DATA.boards[id]); });

       wheel(s, fig, opp, wheel, rule)  -> ruleta efectiva de fig contra opp (devuelve la ruleta)

  const RULES = {};

  function runHook(s, name, args) {

<script>
/* ===================== IA DE LA CPU (puntuación de jugadas) ===================== */
(function (root) {

  const LEVELS = {
    facil:   { name: 'Fácil',   noise: 70, randomPick: 0.25, threatW: 600,  danger: 0 },
    normal:  { name: 'Normal',  noise: 10, randomPick: 0,    threatW: 4000, danger: 0.35 },
    // Difícil valora más la posición y la seguridad que correr hacia la meta (ajustado por simulación)

  function figWorth(B, f, turn, lv) {

    if (s.winner === 1 - me) return -1e6;
    if (s.winner === 'draw') return 0;
    const occ = D.occupancy(s); let score = 0; const B = D.boardOf(s);
    for (const f of s.figs) {
      const sign = f.owner === me ? 1 : -1;
      if (f.loc === 'board') {
        let v = figWorth(B, f, s.turn, lv);
        if (f.status) v -= { sleep: 18, freeze: 24, para: 12, poison: 8 }[f.status.k];
        // riesgo de quedar rodeada: queda una sola salida y el resto son rivales
        const ns = B.adj[f.node];
        const rivals = ns.filter(n => occ[n] !== -1 && s.figs[occ[n]].owner !== f.owner).length;
        const free = ns.filter(n => occ[n] === -1).length;
        if (free === 1 && rivals === ns.length - 1) v -= f.owner === me ? 70 : 25;
        if (f.owner === me && f.node === B.goal[me]) v += 12;
        score += sign * v;
      } else if (f.loc === 'ko') score -= sign * (lv.koPen || 20);
    }
    const mine = winThreats(s, me, occ).length;
    const theirs = winThreats(s, 1 - me, occ).length;
    if (theirs) score -= lv.threatW + 200 * theirs; // el rival juega ahora: ganaría
    if (mine) score += 90 + 40 * mine;
    if (lv.danger) score -= lv.danger * attackDanger(s, me, occ);
    return score;
  }

  // Valor esperado de atacar: se agrupan los resultados de la ruleta y se evalúa cada uno
  function attackValue(s, aId, tId, me, lv) {
    const A = s.figs[aId], T = s.figs[tId];
    const wa = D.effectiveWheel(A, T, s), wd = D.effectiveWheel(T, A, s);
    const ta = wa.reduce((x, y) => x + y.w, 0), td = wd.reduce((x, y) => x + y.w, 0);
    const buckets = new Map();
    wa.forEach((a, i) => wd.forEach((d, j) => {
      const c = D.compareSegs(a, d);
      const key = c > 0 ? 'A' + i : c < 0 ? 'D' + j : 'T';
      const p = (a.w / ta) * (d.w / td);
      const b = buckets.get(key); if (b) b.p += p; else buckets.set(key, { p, i, j });
    }));
    let ev = 0;
    for (const b of buckets.values()) {
      const r = D.applyAction(s, { type: 'attack', fig: aId, target: tId, spin: { ai: b.i, di: b.j } });
      ev += b.p * evaluate(r.state, me, lv);
    }
    return ev;
  }

  // Mejor continuación una vez que la figura ya se movió (atacar o terminar)
  function bestFollowUp(s, me, lv) {
    let best = { score: -Infinity, act: { type: 'end' } };
    for (const a of D.legalActions(s)) {
      const sc = a.type === 'end' ? evaluate(D.applyAction(s, a).state, me, lv) : attackValue(s, a.fig, a.target, me, lv);
      if (sc > best.score) best = { score: sc, act: a };
    }
    return best;
  }

  function choose(s, level, rng) {
    rng = rng || Math.random;
    const lv = LEVELS[level] || LEVELS.normal;
    const me = s.current;
    const acts = D.legalActions(s);
    if (!acts.length) return { type: 'pass' };
    if (s.awaitAttack !== null) {
      if (lv.randomPick && rng() < lv.randomPick) return acts[Math.floor(rng() * acts.length)];
      return bestFollowUp(s, me, lv).act;
    }
    // ganar ya si se puede
    const win = acts.find(a => (a.type === 'move' || a.type === 'enter') && a.to === goalOfRival(D.boardOf(s), me));
    if (win) return win;
    if (lv.randomPick && rng() < lv.randomPick) return acts[Math.floor(rng() * acts.length)];
    const scored = acts.map(a => {
      const r = D.applyAction(s, a);
      let sc = r.state.awaitAttack !== null ? bestFollowUp(r.state, me, lv).score : evaluate(r.state, me, lv);
      if (a.type === 'stay') sc -= 2; // preferir moverse si da igual
      return { a, sc: sc + (rng() * 2 - 1) * lv.noise };
    }).sort((x, y) => y.sc - x.sc);
    return scored[0].a;
  }

  const api = { LEVELS, choose, evaluate, winThreats };
  root.DuelAI = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===================== TUTORIAL: MOTOR DE PASOS (sin DOM) =====================
   Una lección (data/tutorial/*.json) es una partida real del motor con:
   - posición inicial fija ("player", "rival", "first", "setup"),
   - pasos para el jugador ("steps"): "info" (texto y botón Siguiente), "tap" (tocar una figura)
     o "act" (hacer una acción concreta: enter, move, attack o end),
   - jugadas de la CPU en orden ("cpu"), en vez de la IA,
   - resultados fijos de las ruletas ("spin": índices de segmento de atacante y defensor).
   La interfaz pregunta aquí qué toques permite y qué ruleta usar; test/tutorial.js recorre
   cada lección con el motor para comprobar que todo el guion es legal y se puede terminar. */
(function (root) {
  'use strict';
  const D = root.Duel || (typeof require !== 'undefined' ? require('./logic.js') : null);

  function loadLessons() {
    let raw = null;
    if (root.DUEL_DATA && root.DUEL_DATA.tutorial) raw = root.DUEL_DATA.tutorial;
    else if (typeof require === 'function' && typeof __dirname === 'string') {
      const fs = require('fs'), path = require('path');
      const base = path.join(__dirname, '..', 'data', 'tutorial'); raw = {};
      fs.readdirSync(base).filter(f => f.endsWith('.json')).forEach(f => { const j = JSON.parse(fs.readFileSync(path.join(base, f), 'utf8')); raw[j.id] = j; });
    }
    return Object.values(raw || {}).sort((a, b) => a.orden - b.orden);
  }
  const LESSONS = loadLessons();

  // Partida inicial de una lección
  function buildState(lesson) {
    const s = D.newGame(lesson.player, lesson.rival, lesson.first || 0, {
      id: 'tutorial-' + lesson.id, board: lesson.board || 'clasico', rules: [], victory: { type: 'goal', turnLimit: 300 }
    });
    (lesson.setup || []).forEach(p => {
      const f = s.figs[p.fig];
      if (!f) throw new Error('Lección ' + lesson.id + ': no existe la figura ' + p.fig);
      if (p.node !== undefined) { f.loc = 'board'; f.node = p.node; }
      if (p.status) f.status = { k: p.status, left: p.left || D.STATUS[p.status].dur, at: 0 };
    });
    const errs = D.validate(s);
    if (errs.length) throw new Error('Lección ' + lesson.id + ': ' + errs.join('; '));
    return s;
  }

  // ¿La acción a coincide con la esperada e? (los campos que e no fija no importan)
  function sameAct(a, e) {
    if (!a || !e || a.type !== e.type) return false;
    for (const k of ['fig', 'to', 'target']) if (e[k] !== undefined && a[k] !== e[k]) return false;
    return true;
  }

  function createGuide(lesson) {
    const g = {
      lesson, i: 0, cpuIdx: 0, pendingSpin: null, finished: false,
      start() { return buildState(lesson); },
      get step() { return lesson.steps[g.i] || null; },
      get isLast() { return g.i >= lesson.steps.length - 1; },
      text() { const st = g.step; return st ? st.text : ''; },
      // Figuras y cruces que la interfaz debe resaltar en el paso actual
      highlights() {
        const st = g.step; const out = { figs: [], nodes: [], button: null };
        if (!st) return out;
        if (st.tap) out.figs.push(st.tap.fig);
        if (st.act) {
          if (st.act.fig !== undefined) out.figs.push(st.act.fig);
          if (st.act.target !== undefined) out.figs.push(st.act.target);
          if (st.act.to !== undefined) out.nodes.push(st.act.to);
          if (st.act.type === 'end') out.button = 'end';
        }
        if (st.info) out.button = 'next';
        return out;
      },
      // Toques permitidos: solo los que llevan a la acción del paso
      allowsFig(id) {
        const st = g.step; if (!st) return false;
        if (st.tap) return st.tap.fig === id;
        if (st.act) return st.act.fig === id || st.act.target === id;
        return false;
      },
      allowsNode(n) { const st = g.step; return !!(st && st.act && st.act.to === n); },
      // Acción que el jugador va a ejecutar: solo pasa la del paso. Si pasa, el guion avanza.
      allowsAct(a) {
        const st = g.step;
        if (!st || !st.act || !sameAct(a, st.act)) return false;
        g.pendingSpin = st.spin || null;
        g.i++;
        return true;
      },
      // Tocar la figura pedida en un paso "tap" lo completa
      tapped(id) { const st = g.step; if (st && st.tap && st.tap.fig === id) { g.i++; return true; } return false; },
      next() { const st = g.step; if (st && st.info) { g.i++; return true; } return false; },
      get done() { return g.i >= lesson.steps.length; },
      // Jugada de la CPU según el guion; sin guion, pasa (solo si no tiene jugadas)
      cpuAction(s) {
        const a = (lesson.cpu || [])[g.cpuIdx];
        if (!a) return D.legalActions(s).length ? null : { type: 'pass' };
        g.cpuIdx++;
        const act = { ...a }; delete act.spin;
        if (act.type === 'move' || act.type === 'enter') {
          const legal = D.legalActions(s).find(x => sameAct(x, act));
          if (legal) act.path = legal.path;
        }
        g.pendingSpin = a.spin || null;
        return act;
      },
      // Resultado fijo de la ruleta para el combate que empieza (o null para sortear)
      takeSpin(s, aId, dId) {
        const sp = g.pendingSpin; g.pendingSpin = null;
        if (!sp) return null;
        const A = s.figs[aId], T = s.figs[dId];
        return { ai: sp.ai, di: sp.di, wa: D.effectiveWheel(A, T, s), wd: D.effectiveWheel(T, A, s) };
      }
    };
    return g;
  }

  /* ---------- Progreso (qué lecciones se completaron) ---------- */
  const KEY = 'duelo-nodos-tutorial';
  function readProgress(storage) {
    try { const r = storage.get(KEY); const p = r ? JSON.parse(r) : {}; return { hechas: p.hechas || [], ofrecido: !!p.ofrecido }; }
    catch (e) { return { hechas: [], ofrecido: false }; }
  }
  function writeProgress(storage, p) { storage.set(KEY, JSON.stringify(p)); }

  const api = { LESSONS, buildState, createGuide, sameAct, readProgress, writeProgress, KEY };
  root.DuelTutorial = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===================== CAMPAÑA (sin DOM) =====================
   Datos: data/campaign/campana.json (capítulos y duelos), escenas.json (generado desde docs/guion.md),
   personajes.json, guiados/*.json (duelos guiados) y data/duels/c*.json (configuración de cada duelo).
   Progreso en Platform.storage, clave "duelo-nodos-campana":
     { v, jugador, ganados: [id], sellos: [id], figuras: [criatura], equipo: [6 criaturas] }
   Reglas de la campaña: desbloqueo lineal; el equipo se arma con las criaturas desbloqueadas y
   se pueden repetir (decidido en la Fase 3). */
(function (root) {
  'use strict';
  const D = root.Duel || (typeof require !== 'undefined' ? require('./logic.js') : null);
  const KEY = 'duelo-nodos-campana';
  const TAM_EQUIPO = 6;

  function loadData() {
    if (root.DUEL_DATA && root.DUEL_DATA.campaign) return root.DUEL_DATA.campaign;
    if (typeof require === 'function' && typeof __dirname === 'string') {
      const fs = require('fs'), path = require('path');
      const base = path.join(__dirname, '..', 'data', 'campaign');
      const rd = f => JSON.parse(fs.readFileSync(path.join(base, f), 'utf8'));
      const guiados = {};
      fs.readdirSync(path.join(base, 'guiados')).filter(f => f.endsWith('.json')).forEach(f => { const j = rd('guiados/' + f); guiados[j.id] = j; });
      return { campana: rd('campana.json'), escenas: rd('escenas.json').escenas, personajes: rd('personajes.json').personajes, guiados };
    }
    throw new Error('Faltan los datos de la campaña');
  }
  const DATA = loadData();
  const CAMPANA = DATA.campana, ESCENAS = DATA.escenas, PERSONAJES = DATA.personajes, GUIADOS = DATA.guiados;
  const DUELOS = CAMPANA.duelos;
  const duelo = id => DUELOS.find(d => d.id === id) || null;
  const capitulo = id => CAMPANA.capitulos.find(c => c.id === id) || null;

  /* ---------- Progreso ---------- */
  function limpiarNombre(n) {
    n = String(n == null ? '' : n).replace(/[<>&"{}]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
    return n || 'Ari';
  }
  function nuevo(nombre) { return { v: 1, jugador: limpiarNombre(nombre), ganados: [], sellos: [], figuras: [], equipo: [] }; }
  // Valida y normaliza un progreso (de storage o de un código importado); lanza si no sirve
  function normalizar(p) {
    if (!p || typeof p !== 'object' || p.v !== 1) throw new Error('No es un progreso de campaña válido');
    const ids = new Set(DUELOS.map(d => d.id));
    const out = nuevo(p.jugador);
    out.ganados = (Array.isArray(p.ganados) ? p.ganados : []).filter(id => ids.has(id));
    out.sellos = (Array.isArray(p.sellos) ? p.sellos : []).filter(s => typeof s === 'string').slice(0, 5);
    out.figuras = (Array.isArray(p.figuras) ? p.figuras : []).filter(k => D.CREATURE[k]);
    out.equipo = (Array.isArray(p.equipo) ? p.equipo : []).filter(k => out.figuras.includes(k)).slice(0, TAM_EQUIPO);
    return out;
  }
  function leer(storage) {
    try { const r = storage.get(KEY); return r ? normalizar(JSON.parse(r)) : null; } catch (e) { return null; }
  }
  function guardar(storage, p) { storage.set(KEY, JSON.stringify(p)); }

  // Estado de un duelo para el mapa: ganado, abierto (el siguiente por jugar), bloqueado o proximamente
  function estado(p, d) {
    if (p.ganados.includes(d.id)) return 'ganado';
    if (d.disponible === false) return 'proximamente';
    const i = DUELOS.indexOf(d);
    return DUELOS.slice(0, i).every(x => p.ganados.includes(x.id)) ? 'abierto' : 'bloqueado';
  }
  function siguiente(p) { return DUELOS.find(d => estado(p, d) === 'abierto') || null; }

  // Victoria: suma el duelo, las figuras y el sello de la recompensa (sin repetir). Devuelve un progreso nuevo.
  function ganar(p, id) {
    const d = duelo(id); if (!d) throw new Error('Duelo desconocido: ' + id);
    const q = normalizar(JSON.parse(JSON.stringify(p)));
    if (!q.ganados.includes(id)) q.ganados.push(id);
    const r = d.recompensa || {};
    (r.figuras || []).forEach(k => { if (!q.figuras.includes(k)) q.figuras.push(k); });
    if (r.sello && !q.sellos.includes(r.sello)) q.sellos.push(r.sello);
    return q;
  }

  /* ---------- Equipo (se permiten repetidas) ---------- */
  function equipoValido(team, p) { return Array.isArray(team) && team.length === TAM_EQUIPO && team.every(k => p.figuras.includes(k)); }
  function equipoPorDefecto(p) {
    if (equipoValido(p.equipo, p)) return p.equipo.slice();
    if (!p.figuras.length) return [];
    return Array.from({ length: TAM_EQUIPO }, (_, i) => p.figuras[i % p.figuras.length]);
  }

  /* ---------- Exportar / importar (un código para copiar y pegar) ---------- */
  const PREFIJO = 'HT1.';
  function b64enc(s) { return typeof btoa === 'function' ? btoa(unescape(encodeURIComponent(s))) : Buffer.from(s, 'utf8').toString('base64'); }
  function b64dec(s) { return typeof atob === 'function' ? decodeURIComponent(escape(atob(s))) : Buffer.from(s, 'base64').toString('utf8'); }
  function exportar(p) { return PREFIJO + b64enc(JSON.stringify(normalizar(p))); }
  function importar(code) {
    code = String(code || '').replace(/\s+/g, '');
    if (!code.startsWith(PREFIJO)) throw new Error('El código no empieza con ' + PREFIJO);
    let p; try { p = JSON.parse(b64dec(code.slice(PREFIJO.length))); } catch (e) { throw new Error('El código está incompleto o dañado'); }
    return normalizar(p);
  }

  /* ---------- Escenas y personajes ---------- */
  const conJugador = (t, p) => String(t || '').split('{jugador}').join(p ? p.jugador : 'Ari');
  function personaje(id) { return PERSONAJES[id] || { nombre: id, color: '#9ba6c9', expresiones: {} }; }
  // Archivo del retrato (o null: la interfaz muestra un círculo con la inicial)
  function retrato(id, expr) {
    const e = personaje(id).expresiones || {};
    const f = e[expr] || e.neutral;
    return f ? 'art/web/retratos/' + f + '.webp' : null;
  }
  // Escena lista para mostrar: líneas con nombre, color, retrato y lado
  function escena(id, d, p) {
    const e = ESCENAS[id]; if (!e) throw new Error('Escena desconocida: ' + id);
    const expr = (CAMPANA.expresiones || {})[id] || {};
    const cap = d ? capitulo(d.capitulo) : null;
    const fondo = (CAMPANA.fondos || {})[id] || (cap && cap.fondo) || null;
    const armar = l => {
      const per = personaje(l.quien);
      return {
        quien: l.quien, nombre: conJugador(l.nombre, p), color: per.color, narracion: !!per.narracion,
        retrato: per.narracion ? null : retrato(l.quien, expr[l.quien] || 'neutral'),
        lado: l.quien === 'jugador' ? 'izq' : 'der',
        texto: conJugador(l.texto, p), accion: conJugador(l.accion, p),
        opciones: l.opciones ? l.opciones.map(o => ({ texto: conJugador(o.texto, p), respuesta: armar(o.respuesta) })) : null
      };
    };
    return { id, titulo: conJugador(e.titulo, p), escenario: conJugador(e.escenario, p), fondo: fondo ? 'art/web/fondos/' + fondo + '.webp' : null, lineas: e.lineas.map(armar) };
  }

  // Duelo guiado (lección) con los textos del "Pasos guiados" del guion
  function guiado(id) {
    const g = GUIADOS[id]; if (!g) throw new Error('Duelo guiado desconocido: ' + id);
    const pasos = (ESCENAS[id + '-pasos'] || {}).pasos || [];
    const lesson = JSON.parse(JSON.stringify(g));
    lesson.steps.forEach(st => {
      const ps = pasos[st.paso - 1]; if (!ps) throw new Error(id + ': no existe el paso ' + st.paso + ' en el guion');
      st.text = ps.titulo + ': ' + ps.texto;
    });
    return lesson;
  }
  function configDuelo(d) { const c = D.DUELS[d.duelo]; if (!c) throw new Error('Falta data/duels/' + d.duelo + '.json'); return c; }

  const api = {
    KEY, TAM_EQUIPO, CAMPANA, ESCENAS, PERSONAJES, GUIADOS, DUELOS, duelo, capitulo,
    nuevo, normalizar, leer, guardar, estado, siguiente, ganar, equipoValido, equipoPorDefecto,
    exportar, importar, limpiarNombre, conJugador, personaje, retrato, escena, guiado, configDuelo
  };
  root.DuelCampana = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

/* ===================== PLATAFORMA (web / app nativa) =====================
   Única capa que conoce Capacitor. En la web (GitHub Pages) no existe window.Capacitor
   y todo cae en el comportamiento de siempre: localStorage y sin vibración.
   En la app, build.py --out www agrega capacitor.js (de @capacitor/core) antes de este archivo. */
(function () {
  'use strict';
  const Cap = window.Capacitor;
  const native = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.registerPlugin);
  const plug = name => (native && Cap.isPluginAvailable(name)) ? Cap.registerPlugin(name) : null;
  const App = plug('App'), Haptics = plug('Haptics'), Prefs = plug('Preferences'), Splash = plug('SplashScreen');
  const ignore = () => {};
  const VIBRA_KEY = 'duelo-nodos-vibra';

  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } }
  };

  /* Guardado: lectura y escritura síncronas en localStorage (lo que la UI ya usaba) y, en la app,
     copia en Preferences (almacenamiento nativo), que el sistema no borra como puede pasar con el
     almacenamiento web. Al arrancar, restore() recupera desde Preferences lo que falte. */
  const storage = {
    get: ls.get,
    set(k, v) { ls.set(k, v); if (Prefs) Prefs.set({ key: k, value: v }).catch(ignore); },
    del(k) { ls.del(k); if (Prefs) Prefs.remove({ key: k }).catch(ignore); }
  };
  function restore(keys) {
    if (!Prefs) return Promise.resolve();
    const work = Promise.all(keys.map(k => Prefs.get({ key: k }).then(r => {
      const local = ls.get(k);
      if (local === null && r && r.value != null) ls.set(k, r.value);        // web borrado: recuperar
      else if (local !== null && (!r || r.value !== local)) Prefs.set({ key: k, value: local }).catch(ignore); // primera vez: respaldar
    }).catch(ignore)));
    return Promise.race([work, new Promise(r => setTimeout(r, 1500))]);     // nunca bloquear el arranque
  }

  /* Vibración: solo en la app y si el jugador no la desactivó. */
  let vibra = ls.get(VIBRA_KEY) !== '0';
  function haptic(kind) {
    if (!Haptics || !vibra) return;
    const p = kind === 'win' ? Haptics.notification({ type: 'SUCCESS' })
      : kind === 'lose' ? Haptics.notification({ type: 'ERROR' })
      : Haptics.impact({ style: kind === 'hit' ? 'MEDIUM' : 'LIGHT' });
    p.catch(ignore);
  }

  window.Platform = {
    native,
    canVibrate: !!Haptics,
    storage,
    restore,
    haptic,
    get vibra() { return vibra; },
    setVibra(v) { vibra = !!v; ls.set(VIBRA_KEY, vibra ? '1' : '0'); if (vibra) haptic('tap'); },
    /* Botón "atrás" de Android. Al registrarlo, Capacitor deja de cerrar la app por su cuenta. */
    onBack(fn) { if (App) App.addListener('backButton', fn); },
    /* Mandar la app a segundo plano (como el botón de inicio) en vez de cerrarla. */
    minimize() { if (App) App.minimizeApp().catch(ignore); },

<script>

(function () {

  /* ---------- Versión y comentarios (los inyecta build.py desde package.json y src/config.json) ---------- */

  const icon = (id, cls) => '<svg class="ic' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  const typeIcon = t => icon('ty-' + t);
  function creatureImg(c, kind, cls) {
    const a = ART[c.id];
    if (!a || !a[kind]) return '<span class="emo">' + c.emoji + '</span>';
    return '<img class="art' + (cls ? ' ' + cls : '') + '" src="' + a[kind] + '" alt="" data-emoji="' + c.emoji + '" draggable="false">';
  }
  // Respaldo: si una imagen del arte no carga, vuelve el emoji (HTML) o el texto (tablero SVG)
  document.addEventListener('error', e => {

  /* ---------- Ruletas en canvas ---------- */
  function prepCanvas(cv, size) {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr);
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    cv.dataset.size = size;
  }
  function shortVal(s) {
    if (s.forced) return '✕';
    if (s.t === 'w' || s.t === 'g') return String(s.dmg);
    if (s.t === 'p') return '★'.repeat(s.stars);
    if (s.t === 'b') return 'Esq';
    return '✕';
  }
  // Patrón de cada color de segmento, para quien no distingue colores (se dibuja con la tinta del segmento)
  const patternCache = {};
  function segPattern(ctx, t, dpr) {
    if (t === 'w') return null;
    const key = t + '@' + dpr;
    if (!patternCache[key]) {
      const n = t === 'b' ? 10 : 7; const tile = document.createElement('canvas');
      tile.width = tile.height = Math.round(n * dpr);
      const c = tile.getContext('2d'); c.scale(dpr, dpr);
      c.strokeStyle = c.fillStyle = t === 'g' ? 'rgba(58,42,0,.5)' : 'rgba(255,255,255,.42)'; c.lineWidth = 1.3;
      if (t === 'r') { c.beginPath(); c.moveTo(-1, n + 1); c.lineTo(n + 1, -1); c.moveTo(-1, 1); c.lineTo(1, -1); c.moveTo(n - 1, n + 1); c.lineTo(n + 1, n - 1); c.stroke(); }
      else if (t === 'g') { c.beginPath(); c.arc(n / 2, n / 2, 1.5, 0, Math.PI * 2); c.fill(); }
      else if (t === 'p') { c.lineWidth = 1.1; c.beginPath(); c.moveTo(0, .5); c.lineTo(n, .5); c.moveTo(.5, 0); c.lineTo(.5, n); c.stroke(); }
      else if (t === 'b') { c.beginPath(); c.moveTo(0, n * .6); c.quadraticCurveTo(n / 4, n * .15, n / 2, n * .6); c.quadraticCurveTo(n * .75, n * 1.05, n, n * .6); c.stroke(); }

    const p = ctx.createPattern(patternCache[key], 'repeat');

  }
  function drawWheel(cv, wheel, rot, opts) {
    opts = opts || {};
    const size = +cv.dataset.size; const ctx = cv.getContext('2d');
    const dpr = cv.width / size; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    const TAU = Math.PI * 2, cx = size / 2, cy = size / 2;
    const R = size / 2 - (opts.pointer ? 8 : 2);
    const fr = D.wheelFractions(wheel);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot || 0);
    wheel.forEach((s, i) => {
      const a0 = -Math.PI / 2 + TAU * fr[i][0], a1 = -Math.PI / 2 + TAU * fr[i][1];
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a1); ctx.closePath();
      ctx.fillStyle = D.SEG[s.t].color; ctx.fill();
      const pat = segPattern(ctx, s.t, dpr); if (pat) { ctx.fillStyle = pat; ctx.fill(); }

        ctx.save(); ctx.rotate((a0 + a1) / 2);
        ctx.fillStyle = D.SEG[s.t].ink; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.font = '800 ' + Math.round(size / 11) + 'px Nunito, system-ui, sans-serif';
        // contorno del color del segmento: el número se lee sobre el patrón
        ctx.lineJoin = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = D.SEG[s.t].color; ctx.strokeText(shortVal(s), R - 7, 0);
        ctx.fillText(shortVal(s), R - 7, 0); ctx.restore();
      }
    });
    ctx.beginPath(); ctx.arc(0, 0, R * 0.16, 0, TAU); ctx.fillStyle = '#0e1322'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.stroke();
    if (opts.pointer) {
      ctx.beginPath(); ctx.moveTo(cx - 10, 0); ctx.lineTo(cx + 10, 0); ctx.lineTo(cx, 22); ctx.closePath();
      ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#0e1322'; ctx.stroke();
    }
  }

  /* ---------- Fichas ---------- */
  // Relación de tipo de a frente a b: 1 = a tiene ventaja, -1 = b tiene ventaja, 0 = neutro
  function typeRel(a, b) { if (D.TYPES[a].beats === b) return 1; if (D.TYPES[b].beats === a) return -1; return 0; }
  function weakTo(t) { return D.TYPE_ORDER.find(x => D.TYPES[x].beats === t); }
  function typeStripHTML() {

  }
  function cycleSVG() {
    const R = 78, cx = 130, cy = 104, pts = D.TYPE_ORDER.map((t, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return { t, x: cx + R * Math.cos(a), y: cy + R * Math.sin(a) }; });
    let g = '<svg class="cycle-svg" viewBox="0 0 260 210" role="img" aria-label="Ciclo de tipos"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ba6c9"/></marker></defs>';
    pts.forEach((p, i) => { const q = pts[(i + 1) % 5]; const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy), k = 27 / L;
      g += '<line x1="' + (p.x + dx * k).toFixed(1) + '" y1="' + (p.y + dy * k).toFixed(1) + '" x2="' + (q.x - dx * k).toFixed(1) + '" y2="' + (q.y - dy * k).toFixed(1) + '" stroke="#9ba6c9" stroke-width="2.5" marker-end="url(#ah)"/>'; });
    pts.forEach(p => { g += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="24" fill="' + D.TYPES[p.t].color + '"/><use href="#ty-' + p.t + '" x="' + (p.x - 7).toFixed(1) + '" y="' + (p.y - 17).toFixed(1) + '" width="14" height="14" style="color:#10172b"/><text x="' + p.x.toFixed(1) + '" y="' + (p.y + 7).toFixed(1) + '" style="fill:#10172b">' + D.TYPES[p.t].name + '</text>'; });
    return g + '</svg>';
  }
  function typeChip(t) { const T = D.TYPES[t]; return '<span class="chip"><span style="color:' + T.color + '">' + typeIcon(t) + '</span>' + T.name + '</span>'; }
  function segRows(wheel) {
    return wheel.map(s => '<tr><td><span class="sq seg-' + s.t + '" style="background-color:' + D.SEG[s.t].color + '"></span></td><td class="n">' + esc(s.name) +

  function renderFicha() {

  }
  function bigFichaHTML(c) {
    return '<div class="big-ficha">' + creatureImg(c, 'ficha', 'big') + '<div>' + typeChip(c.type) + ' <span class="chip">MP ' + c.mp + '</span> <span class="chip">' + D.RARITY[c.rarity] + '</span> <span class="chip">Vence a ' + D.TYPES[D.TYPES[c.type].beats].name + '</span></div>' +
      '<canvas></canvas><table class="segs">' + segRows(c.wheel) + '</table></div>';

  /* ---------- Modal ---------- */
  let modalResolve = null;

    $('#modal-body').innerHTML = html;

        b.type = 'button';

  function closeModal(v) { $('#modal').hidden = true; if (modalResolve) { const r = modalResolve; modalResolve = null; r(v); } }

  /* ---------- Reglas ---------- */
  function rulesHTML() {
    const seg = t => '<span class="k"><span class="sq seg-' + t + '" style="background-color:' + D.SEG[t].color + '"></span>' + D.SEG[t].name + '</span>';

      '<p style="margin-top:8px">Si gana un ataque <b>blanco o dorado</b>, el rival va a la <b>enfermería</b> 2 turnos tuyos y luego vuelve a la banca. Si gana un <b>morado</b>, el rival queda con ese estado. Cualquiera de las dos figuras puede perder.</p>' +

  /* ---------- Pantalla de equipo ---------- */

  function placeFig(g, nodeId) { const n = brd().nodes[nodeId]; g.style.transform = 'translate(' + n.x + 'px,' + n.y + 'px)'; }
  function renderBoard() {

      else st.style.display = 'none';

      else av.style.display = 'none';
    });
    for (const [id, g] of ui.figEls) if (!alive.has(id)) { g.remove(); ui.figEls.delete(id); }
    // resaltados

    if (ui.sel) {
      for (const [n] of ui.sel.dest) { const N = brd().nodes[n]; hl.appendChild(svgEl('circle', { class: 'hl-go', cx: N.x, cy: N.y, r: 16 })); hl.appendChild(svgEl('circle', { class: 'hl-go-ring', cx: N.x, cy: N.y, r: 19 })); }
    }
    targetIds().forEach(id => { const N = brd().nodes[s.figs[id].node]; hl.appendChild(svgEl('circle', { class: 'hl-hit', cx: N.x, cy: N.y, r: 27 })); });
    if (ui.guide && canAct()) {

      const ring = n => { const N = brd().nodes[n]; hl.appendChild(svgEl('circle', { class: 'hl-guide', cx: N.x, cy: N.y, r: 31 })); };
      h.nodes.forEach(ring);
      h.figs.forEach(id => { const f = s.figs[id]; if (f && f.loc === 'board') ring(f.node); });
    }
  }
  // Figura de referencia para las marcas de ventaja: la seleccionada o la última tocada
  function advRef() {
    const s = ui.state;
    const id = ui.confirm ? ui.confirm.fig
      : (s.awaitAttack !== null && s.current === 0) ? s.awaitAttack
      : ui.sel ? ui.sel.fig : (ui.info && ui.info.fig !== undefined ? ui.info.fig : null);
    return id === null ? null : s.figs[id];
  }
  function advOf(f) {
    const ref = advRef();
    if (!ref || f.owner === ref.owner) return 0;
    return typeRel(D.creatureOf(ref).type, D.creatureOf(f).type);
  }
  function targetIds() {
    const s = ui.state;
    if (ui.busy || s.current !== 0 || s.winner !== null) return [];
    if (s.awaitAttack !== null) return D.adjacentRivals(s, s.figs[s.awaitAttack]);
    return ui.sel ? ui.sel.targets : [];
  }

  /* ---------- Bancas ---------- */
  function renderBenches() {
    [0, 1].forEach(o => {
      const box = $('#bench-' + o); box.innerHTML = '<span class="who">' + (o === 0 ? 'Tú' : 'CPU') + '</span>';
      box.className = 'bench p' + o;
      ui.state.figs.filter(f => f.owner === o).sort((a, b) => a.slot - b.slot).forEach(f => {
        const c = D.creatureOf(f);
        const rel = advOf(f);
        const guided = ui.guide && canAct() && f.loc === 'bench' && ui.guide.highlights().figs.includes(f.id);
        const b = el('button', 'slot ' + f.loc + (ui.sel && ui.sel.fig === f.id ? ' sel' : '') + (rel > 0 ? ' up' : rel < 0 ? ' down' : '') + (guided ? ' guide' : ''));
        b.type = 'button';
        b.innerHTML = creatureImg(c, 'token') + '<span class="tic" style="background:' + D.TYPES[c.type].color + '">' + typeIcon(c.type) + '</span>';
        if (f.loc === 'ko') b.dataset.ko = f.koLeft;
        b.setAttribute('aria-label', c.name + (f.loc === 'bench' ? ' en la banca' : f.loc === 'ko' ? ' en la enfermería' : ' en el tablero'));

  /* ---------- Panel y mensajes ---------- */
  function setActions(list) {
    const box = $('#actions'); box.innerHTML = '';
    (list || []).forEach(a => {
      const b = el('button', 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), esc(a.label));
      b.type = 'button'; b.addEventListener('click', a.onClick); box.appendChild(b);
    });
  }
  function renderPanel() {
    const s = ui.state; let msg = ui.msg; let acts = [];
    if (s.winner === null && !ui.busy && s.current === 0) {
      if (ui.confirm) {
        const o = D.battleOdds(s, ui.confirm.fig, ui.confirm.target);
        const p = x => Math.round(x * 100) + '%';
        const rel = typeRel(D.creatureOf(s.figs[ui.confirm.fig]).type, D.creatureOf(s.figs[ui.confirm.target]).type);
        msg = '¿Atacar a <b>' + esc(D.creatureOf(s.figs[ui.confirm.target]).name) + '</b>? Ganas ' + p(o.win) + ' · empate ' + p(o.tie) + ' · pierdes ' + p(o.lose) +
          (rel > 0 ? '<br>▲ Tienes ventaja de tipo (+10 a tus blancos).' : rel < 0 ? '<br>▼ El rival tiene ventaja de tipo (+10 a sus blancos).' : '');
        acts = [{ kind: 'back', label: 'Volver', onClick: () => { ui.confirm = null; refresh(); } }, { kind: 'attack', label: 'Atacar', primary: true, onClick: doAttack }];
      } else if (s.awaitAttack !== null) {
        if (s.forcedAttack) msg = '<b>Ataque obligatorio:</b> toca un rival marcado en rojo.';
        else { msg = 'Puedes atacar: toca un rival marcado en rojo.'; acts = [{ kind: 'end', label: 'No atacar', onClick: () => commit({ type: 'end' }) }]; }
      } else if (ui.sel) {
        acts = [{ kind: 'cancel', label: 'Cancelar', onClick: () => { ui.sel = null; ui.msg = ''; refresh(); } }];
        if (!msg) msg = ui.sel.dest.size && ui.sel.targets.length ? 'Toca una casilla verde para moverte o un rival en rojo para atacar sin moverte.'
          : ui.sel.dest.size ? 'Toca una casilla verde.'
          : ui.sel.targets.length ? (D.mustAttack(s) ? '<b>Ninguna figura puede moverse:</b> debes atacar. ' : 'No puede moverse, pero puede atacar. ') + 'Toca un rival en rojo.'
          : 'Esta figura no tiene jugadas. Elige otra.';
      } else if (!msg) msg = D.mustAttack(s) ? '<b>Ninguna figura puede moverse:</b> el ataque es obligatorio. Toca una figura tuya junto a un rival.'
          : 'Tu turno: mueve una figura o ataca con una que tenga un rival al lado.';
    }
    // Tutorial: el texto del paso reemplaza al mensaje y solo quedan los botones que sirven al paso
    if (ui.guide && s.winner === null && !ui.busy && s.current === 0 && ui.guide.step) {
      const g = ui.guide, st = g.step;
      msg = '<span class="guide-t">' + esc(st.text) + '</span>' + (ui.confirm ? '<br><span class="guide-odds">' + msg + '</span>' : '');
      acts = acts.filter(a => a.kind === 'attack' || a.kind === 'back' || (a.kind === 'end' && st.act && st.act.type === 'end'));
      if (st.info) acts = [{ label: g.isLast ? 'Terminar' : 'Siguiente', primary: true, onClick: guideNext }];
    }
    $('#msg').innerHTML = msg || '';
    setActions(acts);
    const pill = $('#turn-pill');
    if (s.winner !== null) { pill.className = 'pill'; pill.innerHTML = 'Partida terminada'; }
    else { pill.className = 'pill p' + s.current; pill.innerHTML = (s.current === 0 ? 'Tu turno' : 'Turno CPU') + ' <small>· ' + s.turn + '/' + D.turnLimitOf(s) + '</small>'; }
  }
  function refresh() { renderBoard(); renderBenches(); renderPanel(); renderFicha(); }
  function say(t) { ui.msg = t; }
  function logEvents(events, who) {
    events.forEach(e => { if (e.text) ui.log.unshift({ turn: ui.state ? ui.state.turn : 0, text: e.text }); });
    if (who) ui.log.unshift({ turn: ui.state.turn, text: who });

  }
  function save() {
    if (!ui.state || ui.guide) return;

    store.set({ v: 1, state: ui.state, level: ui.level, team: ui.team, cpuTeam: ui.cpuTeam, log: ui.log.slice(0, 40), campana: ui.campaign ? ui.campaign.id : null });
  }

  /* ---------- Interacción del jugador ---------- */
  function canAct() { return ui.state && ui.state.winner === null && !ui.busy && ui.state.current === 0; }
  function selectFig(id) {
    const s = ui.state; const f = s.figs[id];
    ui.info = { fig: id }; ui.confirm = null; ui.msg = '';
    if (D.isImmobile(f)) { ui.sel = null; say(D.creatureOf(f).name + ' está ' + D.STATUS[f.status.k].adj + ' y no puede actuar.'); return; }
    const acts = D.legalActions(s).filter(a => a.fig === id);
    const dest = new Map();
    acts.forEach(a => { if (a.type === 'move' || a.type === 'enter') dest.set(a.to, a); });
    const targets = acts.some(a => a.type === 'stay') ? D.adjacentRivals(s, f) : [];
    if (f.loc === 'bench' && !dest.size) { ui.sel = null; say('Tus dos entradas están ocupadas.'); return; }
    ui.sel = { fig: id, dest, targets };
    P.haptic('tap');
  }
  // Tutorial: ¿el toque (figura o cruce) es parte del paso actual? Si no, se ignora y se avisa.
  function guideBlocks(kind, id) {
    const g = ui.guide; if (!g || g.done || !canAct()) return false;
    const ok = kind === 'fig' ? g.allowsFig(id) : g.allowsNode(id);
    if (!ok) nudge();
    return !ok;
  }
  // Tras un toque permitido: si el paso pedía tocar esa figura, se avanza
  function guideAfterTap(id) { if (ui.guide && ui.sel && ui.sel.fig === id) ui.guide.tapped(id); }
  function nudge() { const m = $('#msg'); m.classList.remove('nudge'); void m.offsetWidth; m.classList.add('nudge'); }

  function slotTapped(id) {
    if (guideBlocks('fig', id)) return;
    const f = ui.state.figs[id];
    if (canAct() && f.owner === 0 && f.loc === 'bench' && ui.state.awaitAttack === null) {

    } else { ui.info = { fig: id }; }

  function nodeTapped(n) {

    if (!canAct()) { if (f) { ui.info = { fig: fid }; renderBoard(); renderBenches(); renderFicha(); } return; }
    if (s.awaitAttack !== null) {
      if (f && targetIds().includes(fid)) { ui.confirm = { fig: s.awaitAttack, target: fid, stay: false }; ui.info = { fig: fid }; }

  async function animateMove(act) {
    const s = ui.state; const f = s.figs[act.fig];

    const g = figGroup(tmp); g.dataset.anim = '1';

    for (let i = 1; i < path.length; i++) { placeFig(g, path[i]); await wait(150); }
    await wait(60);
    delete g.dataset.anim;
  }

  async function commit(act) {
    if (ui.busy) return;
    if (ui.guide && !ui.guide.allowsAct(act)) { nudge(); return; }
    ui.busy = true; ui.sel = null; ui.confirm = null; ui.msg = '';
    if (act.type === 'enter' || act.type === 'move') await animateMove(act);
    const r = D.applyAction(ui.state, act);
    ui.state = r.state; logEvents(r.events);
    const extra = r.events.filter(e => e.type === 'surround' || e.type === 'heal' || e.type === 'cure').map(e => e.text).join(' ');

    ui.busy = false;
    save();
    afterAction();
  }

  async function doAttack() {
    const c = ui.confirm; if (!c || ui.busy) return;
    if (ui.guide && !ui.guide.allowsAct({ type: 'attack', fig: c.fig, target: c.target })) { nudge(); return; }
    ui.confirm = null;

  /* ---------- Combate a pantalla completa ---------- */
  function runBattle(aId, dId) {
    ui.busy = true; refresh();
    const s = ui.state;
    const sp = (ui.guide && ui.guide.takeSpin(s, aId, dId)) || D.spinBattle(s, aId, dId, Math.random);
    const preview = D.resolveBattle(s, aId, dId, sp.ai, sp.di);
    const A = s.figs[aId], Df = s.figs[dId];
    const top = A.owner === 1 ? A : Df, bot = A.owner === 1 ? Df : A;
    const sides = [[top, top === A ? sp.wa : sp.wd, top === A ? sp.ai : sp.di, '#bf-top'], [bot, bot === A ? sp.wa : sp.wd, bot === A ? sp.ai : sp.di, '#bf-bot']];
    const size = Math.max(120, Math.min(190, Math.floor((window.innerHeight - 300) / 2), window.innerWidth - 200));
    const anims = sides.map(([f, wheel, idx, sel], k) => {
      const box = $(sel); const c = D.creatureOf(f);
      box.className = 'fighter p' + f.owner;
      const mods = [...new Set(wheel.flatMap(x => x.mods || []))];
      box.querySelector('.fn').innerHTML = creatureImg(c, 'token') + esc(c.name);
      box.querySelector('.fr').innerHTML = (f.id === aId ? 'Ataca' : 'Defiende') + ' · ' + (f.owner === 0 ? 'Tú' : 'CPU') + ' · ' + D.TYPES[c.type].name + (mods.length ? '<br>' + esc(mods.join(' · ')) : '');
      box.querySelector('.res').innerHTML = '';
      const cv = box.querySelector('canvas'); prepCanvas(cv, size);
      const target = D.targetRotation(wheel, idx, 4 + k, Math.random, 0);
      drawWheel(cv, wheel, 0, { labels: true, pointer: true });
      return { box, cv, wheel, idx, target, dur: (reduced ? 350 : (ui.fast ? 1100 : 2100)) + k * (reduced ? 0 : 450) };
    });
    $('#battle-title').textContent = 'Combate';
    $('#battle-text').textContent = 'Girando…';

    $('#battle').hidden = false;
    return new Promise(resolve => {
      let skip = false; const t0 = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      const onSkip = () => { skip = true; };
      $('#battle').addEventListener('pointerdown', onSkip);
      function frame(now) {
        let done = true;
        anims.forEach(a => {
          const t = skip ? 1 : Math.min(1, (now - t0) / a.dur);

        });
        if (!done) { requestAnimationFrame(frame); return; }
        $('#battle').removeEventListener('pointerdown', onSkip);
        anims.forEach(a => {
          const seg = a.wheel[a.idx];
          a.box.querySelector('.res').innerHTML = '<span class="sq seg-' + seg.t + '" style="background-color:' + D.SEG[seg.t].color + '"></span>' + esc(D.segLabel(seg));
        });
        const w = preview.battle.winner;
        if (w !== null) (w === top.id ? anims[0] : anims[1]).box.classList.add('win');
        $('#battle-text').textContent = preview.battle.text;
        if (w !== null) P.haptic('hit');
        go.disabled = false; go.focus();
        go.onclick = () => {
          go.onclick = null;
          $('#battle').hidden = true;

          ui.state = r.state; logEvents(r.events);

  /* ---------- Flujo de turnos ---------- */
  function afterAction() {
    const s = ui.state;
    refresh();
    if (s.winner !== null) { gameOver(); return; }
    if (s.current === 1) { cpuTurn(); return; }
    if (s.awaitAttack === null && !D.legalActions(s).length) {
      ui.busy = true; say('No tienes jugadas posibles: pasas el turno.'); refresh();
      setTimeout(() => { const r = D.applyAction(ui.state, { type: 'pass' }); ui.state = r.state; logEvents(r.events); ui.busy = false; save(); afterAction(); }, 1100);
    }
  }

  // En el tutorial la CPU sigue el guion de la lección; si no hay guion, juega la IA
  const cpuPick = s => (ui.guide && ui.guide.cpuAction(s)) || AI.choose(s, ui.level);

  async function cpuTurn() {
    ui.busy = true; ui.sel = null; ui.confirm = null;
    const prev = ui.msg;
    renderBoard(); renderBenches(); renderPanel();
    $('#msg').innerHTML = (prev ? prev + '<br>' : '') + 'La CPU está pensando…'; setActions([]);
    await wait(prev ? 900 : 500);
    let t0 = performance.now();
    let act = cpuPick(ui.state);
    ui.lastCpuMs = performance.now() - t0;
    let moved = null;
    if (act.type === 'pass') {
      const r = D.applyAction(ui.state, act); ui.state = r.state; logEvents(r.events, 'La CPU no tiene jugadas y pasa.');
      say('La CPU no tiene jugadas y pasa.'); ui.busy = false; save(); afterAction(); return;
    }
    if (act.type === 'enter' || act.type === 'move') {
      await animateMove(act);
      const r = D.applyAction(ui.state, act); ui.state = r.state;
      moved = D.creatureOf(ui.state.figs[act.fig]).name;
      logEvents(r.events, (act.type === 'enter' ? 'La CPU metió a ' : 'La CPU movió a ') + moved + '.');
      say((act.type === 'enter' ? 'La CPU metió a <b>' : 'La CPU movió a <b>') + esc(moved) + '</b>. ' + r.events.filter(e => e.type === 'surround').map(e => e.text).join(' '));
      refresh();
      if (ui.state.winner !== null) { ui.busy = false; save(); afterAction(); return; }
    } else if (act.type === 'stay') {
      ui.state = D.applyAction(ui.state, act).state;
    }
    if (ui.state.awaitAttack !== null && ui.state.current === 1) {
      t0 = performance.now();
      const a2 = cpuPick(ui.state);
      ui.lastCpuMs += performance.now() - t0;
      if (a2.type === 'attack') {
        const nA = D.creatureOf(ui.state.figs[a2.fig]).name, nT = D.creatureOf(ui.state.figs[a2.target]).name;
        $('#msg').innerHTML = '<b>' + esc(nA) + '</b> (CPU) ataca a <b>' + esc(nT) + '</b>.';
        await wait(700);
        await runBattle(a2.fig, a2.target);
      } else {
        const r = D.applyAction(ui.state, { type: 'end' }); ui.state = r.state; logEvents(r.events);
      }
    }
    ui.busy = false; save(); afterAction();
  }

  async function gameOver() {
    if (ui.guide) { finishLesson(); return; } // en el tutorial no se toca la partida guardada
    store.del();
    if (ui.campaign) {
      const c = ui.campaign, w = ui.state.winner; ui.campaign = null;
      P.haptic(w === 0 ? 'win' : 'lose');
      c.onEnd(w === 0 ? 'win' : w === 1 ? 'lose' : 'draw', ui.state.winReason);
      return;
    }
    const s = ui.state;
    const title = s.winner === 0 ? '¡Ganaste!' : s.winner === 1 ? 'Ganó la CPU' : 'Empate';
    P.haptic(s.winner === 0 ? 'win' : 'lose');
    const choice = await openModal(title, '<p>' + esc(s.winReason) + '</p><p class="note">Partida de ' + s.turn + ' turnos en nivel ' + AI.LEVELS[ui.level].name + '.</p>',
      [{ label: 'Cambiar equipo', value: 'team' }, { label: 'Revancha', value: 'again', primary: true }]);
    if (choice === 'again') startGame(ui.team, ui.cpuTeam); else showTeamScreen();
  }

  /* ---------- Inicio ---------- */
  function startGame(team, cpuTeam) {
    ui.campaign = null;
    ui.team = team.slice(); ui.cpuTeam = cpuTeam || D.randomBalancedTeam();
    const first = Math.random() < 0.5 ? 0 : 1;
    ui.state = D.newGame(ui.team, ui.cpuTeam, first, DUEL_LIBRE);
    ui.log = []; ui.sel = null; ui.info = null; ui.confirm = null; ui.busy = false;
    $('#scr-team').hidden = true; $('#scr-game').hidden = false;
    buildBoard();
    say(first === 0 ? 'Sorteo: <b>empiezas tú</b>. Toca una figura de tu banca para meterla.' : 'Sorteo: <b>empieza la CPU</b>.');
    logEvents([], first === 0 ? 'Empiezas tú.' : 'Empieza la CPU.');
    save(); afterAction();
  }
  function resumeGame(sv) {
    ui.campaign = sv.campana && window.DuelCampanaUI ? window.DuelCampanaUI.contexto(sv.campana) : null;
    ui.level = sv.level || 'normal'; ui.team = sv.team; ui.cpuTeam = sv.cpuTeam; ui.state = sv.state; ui.log = sv.log || [];
    ui.sel = null; ui.info = null; ui.confirm = null; ui.busy = false;
    $('#scr-team').hidden = true; $('#scr-game').hidden = false;
    buildBoard(); say('Partida recuperada.'); afterAction();
  }
  /* ---------- Duelos de campaña (los lanza campana-ui.js) ---------- */
  function startCampaignDuel(cfg, team, ctx) {
    ui.guide = null; ui.campaign = ctx;
    ui.level = AI.LEVELS[cfg.ai] ? cfg.ai : 'normal';
    ui.cpuTeam = cfg.rival.team.slice();
    const first = Math.random() < 0.5 ? 0 : 1;
    ui.state = D.newGame(team.slice(), ui.cpuTeam, first, cfg);
    ui.log = []; ui.sel = null; ui.info = null; ui.confirm = null; ui.busy = false;
    hideScreens(); $('#scr-game').hidden = false;
    buildBoard();
    say(first === 0 ? 'Sorteo: <b>empiezas tú</b>.' : 'Sorteo: <b>empieza el rival</b>.');
    logEvents([], first === 0 ? 'Empiezas tú.' : 'Empieza el rival.');
    save(); afterAction();
  }
  function startCampaignGuided(lesson, ctx) {
    ui.campaign = ctx;
    startLesson(lesson, lesson.titulo);
  }
  function hideScreens() { document.querySelectorAll('#app > .screen').forEach(sc => { sc.hidden = true; }); }

  function showTeamScreen() {
    hideScreens(); $('#scr-team').hidden = false;
    renderTeam(); window.scrollTo(0, 0);
  }

  /* ---------- Menú, historial y prueba de ruletas ---------- */
  function wheelTestHTML() {
    const N = 1000; let rows = ''; let worstAll = 0, overAll = 0, segsAll = 0;
    D.CREATURES.forEach(c => {
      const cnt = new Array(c.wheel.length).fill(0);
      for (let i = 0; i < N; i++) cnt[D.pickIndex(c.wheel, Math.random)]++;
      let worst = 0, over = 0;
      c.wheel.forEach((s, i) => { const d = Math.abs(cnt[i] / N - s.w / 96) * 100; worst = Math.max(worst, d); if (d > 3) over++; });
      // la animación debe detenerse en el segmento sorteado
      let stopFails = 0;
      c.wheel.forEach((s, i) => { for (let k = 0; k < 50; k++) if (D.segmentAtRotation(c.wheel, D.targetRotation(c.wheel, i, 4, Math.random, 0)) !== i) stopFails++; });
      worstAll = Math.max(worstAll, worst); overAll += over; segsAll += c.wheel.length;
      rows += '<tr><td>' + creatureImg(c, 'token') + ' ' + esc(c.name) + '</td><td>' + worst.toFixed(1).replace('.', ',') + ' pp</td><td class="' + (over ? 'warn' : 'ok') + '">' + (over ? over + ' fuera' : 'OK') + '</td><td class="' + (stopFails ? 'warn' : 'ok') + '">' + (stopFails ? stopFails : 'OK') + '</td></tr>';
    });
    let big = 0; const M = 100000;
    D.CREATURES.forEach(c => { const cnt = new Array(c.wheel.length).fill(0); for (let i = 0; i < M; i++) cnt[D.pickIndex(c.wheel, Math.random)]++; c.wheel.forEach((s, i) => big = Math.max(big, Math.abs(cnt[i] / M - s.w / 96) * 100)); });
    return '<p>1.000 giros por ruleta con el mismo sorteo del juego. Desvío = diferencia entre la frecuencia observada y el peso del segmento (tolerancia ±3 puntos).</p>' +
      '<table class="test-t"><tr><th>Criatura</th><th>Peor desvío</th><th>±3 pp</th><th>Parada</th></tr>' + rows + '</table>' +
      '<p style="margin-top:10px"><b>Resumen:</b> ' + (segsAll - overAll) + ' de ' + segsAll + ' segmentos dentro de ±3 pp (peor ' + worstAll.toFixed(1).replace('.', ',') + ' pp). Con 100.000 giros por ruleta el peor desvío baja a ' + big.toFixed(2).replace('.', ',') + ' pp.</p>' +
      '<p class="note">Con solo 1.000 giros, el azar normal mueve un segmento de 30% en ±1,5 pp aprox.; que alguno pase de 3 pp de vez en cuando es esperable. "Parada" verifica que la animación cae dentro del segmento sorteado.</p>';
  }
  function openWheelTest() {
    openModal('Prueba de ruletas', wheelTestHTML(), [{ label: 'Repetir', keep: true, onClick: () => { $('#modal-body').innerHTML = wheelTestHTML(); } }, { label: 'Cerrar', primary: true }]);
  }
  function openLog() {
    const items = ui.log.length ? ui.log.map(l => '<li><span>T' + l.turn + '</span>' + l.text.replace(/<[^>]+>/g, '') + '</li>').join('') : '<li>Sin jugadas todavía.</li>';
    openModal('Historial', '<ul class="log">' + items + '</ul>', [{ label: 'Cerrar', primary: true }]);
  }
  function openMenu() {
    const ms = ui.lastCpuMs === null ? '—' : ui.lastCpuMs.toFixed(0) + ' ms';
    openModal('Menú', '<p>Nivel: <b>' + AI.LEVELS[ui.level].name + '</b>. Último turno de la CPU: <b>' + ms + '</b> de cálculo (sin animaciones).</p><p class="note">Versión ' + esc(CFG.version) + '</p>', [
      { label: 'Historial', onClick: () => setTimeout(openLog, 0) },
      { label: 'Prueba de ruletas', onClick: () => setTimeout(openWheelTest, 0) },
      { label: ui.fast ? 'Animación normal' : 'Animación rápida', onClick: () => { ui.fast = !ui.fast; } },
    ].concat(feedbackUrl ? [{ label: 'Enviar comentarios', onClick: openFeedback }] : []).concat(P.canVibrate ? [{ label: P.vibra ? 'Vibración: sí' : 'Vibración: no', onClick: () => P.setVibra(!P.vibra) }] : []).concat([
      ui.guide ? { label: 'Salir del tutorial', danger: true, onClick: () => setTimeout(requestExitTutorial, 0) }
        : { label: 'Abandonar partida', danger: true, onClick: () => setTimeout(confirmQuit, 0) },
      { label: 'Seguir jugando', primary: true }
    ]));
  }
  async function confirmQuit() {
    const v = await openModal('¿Abandonar la partida?', '<p>Se pierde la partida en curso y vuelves a elegir equipo.</p>', [{ label: 'Cancelar', value: 'no' }, { label: 'Abandonar', value: 'yes', danger: true }]);
    if (v === 'yes') {
      store.del(); ui.busy = false;
      if (ui.campaign) { const c = ui.campaign; ui.campaign = null; c.onEnd('exit'); } else showTeamScreen();
    }
  }

  /* ---------- Tutorial ---------- */
  function startLesson(L, titulo) {
    ui.guide = TUT.createGuide(L);
    ui.state = ui.guide.start();
    ui.log = []; ui.sel = null; ui.info = null; ui.confirm = null; ui.busy = false;
    $('#scr-team').hidden = true; $('#scr-game').hidden = false;
    $('#guide-bar').hidden = false;
    $('#guide-title').textContent = titulo || ('Tutorial · ' + L.orden + ' de ' + TUT.LESSONS.length + ': ' + L.titulo);
    buildBoard(); say(''); afterAction();
  }
  function guideNext() {
    ui.guide.next();
    if (ui.guide.done) finishLesson(); else refresh();
  }
  async function finishLesson() {
    const L = ui.guide.lesson; ui.busy = true; refresh();
    if (ui.campaign) { // duelo guiado de campaña: lo cierra campana-ui.js
      const c = ui.campaign; ui.campaign = null; ui.guide = null; ui.busy = false; $('#guide-bar').hidden = true;
      P.haptic('win'); c.onEnd('win'); return;
    }
    const p = TUT.readProgress(P.storage);
    if (!p.hechas.includes(L.id)) p.hechas.push(L.id);
    p.ofrecido = true; TUT.writeProgress(P.storage, p);
    P.haptic('win');
    const next = TUT.LESSONS[TUT.LESSONS.indexOf(L) + 1];
    const v = await openModal(next ? '¡Lección completada!' : '¡Terminaste el tutorial!', '<p>' + esc(L.fin) + '</p>',
      next ? [{ label: 'Salir', value: 'exit' }, { label: 'Siguiente: ' + next.titulo, value: 'next', primary: true }]
        : [{ label: 'Elegir equipo', value: 'exit', primary: true }]);
    if (v === 'next') startLesson(next); else exitTutorial();
  }
  // Salir a pedido del jugador: no mientras la CPU juega o hay un combate (seguirían sobre otra partida)
  function requestExitTutorial() { if (ui.busy) { nudge(); return; } exitTutorial(); }
  function exitTutorial() {
    ui.guide = null; ui.busy = false; ui.state = null;
    $('#guide-bar').hidden = true;
    if (ui.campaign) { const c = ui.campaign; ui.campaign = null; c.onEnd('exit'); return; }
    showTeamScreen();
  }
  function openTutorialList() {
    const p = TUT.readProgress(P.storage);
    const html = '<p>Lecciones cortas con el tablero de verdad. Puedes salir cuando quieras.</p><div class="lessons">' +
      TUT.LESSONS.map((L, i) => '<button type="button" class="btn lesson" data-i="' + i + '"><span>' + L.orden + '. ' + esc(L.titulo) + '</span><small>' +
        (p.hechas.includes(L.id) ? '✓ hecha' : esc(L.duracion)) + '</small></button>').join('') + '</div>';
    openModal('Tutorial', html, [{ label: 'Cerrar', primary: true }]);
    document.querySelectorAll('#modal-body .lesson').forEach(b => b.addEventListener('click', () => { closeModal(); startLesson(TUT.LESSONS[+b.dataset.i]); }));
  }
  // "Cómo jugar" con acceso al tutorial (no durante el turno de la CPU o un combate)
  function openRules() {
    openModal('Cómo jugar', rulesHTML(), (ui.busy ? [] : [{ label: 'Tutorial', onClick: () => setTimeout(openTutorialList, 0) }]).concat([{ label: 'Cerrar', primary: true }]));
  }
  // Primera vez que se abre el juego (sin partida guardada): ofrecer el tutorial una sola vez
  async function offerTutorial() {
    const p = TUT.readProgress(P.storage);
    if (p.ofrecido || store.get()) return;
    p.ofrecido = true; TUT.writeProgress(P.storage, p);
    const v = await openModal('¿Aprender a jugar?', '<p>' + TUT.LESSONS.length + ' lecciones cortas, unos 6 minutos, con el tablero de verdad. Puedes salir cuando quieras y repetirlas desde «Cómo jugar».</p>',
      [{ label: 'Saltar', value: 'skip' }, { label: 'Empezar', value: 'go', primary: true }]);
    if (v === 'go') startLesson(TUT.LESSONS[0]);
  }

  /* ---------- Botón "atrás" (Android) ---------- */
  function onBack() {
    if (!$('#modal').hidden) { closeModal(); return; }   // cierra la ventana abierta
    if (window.DuelCampanaUI && window.DuelCampanaUI.onBack()) return; // diálogo o mapa de campaña
    if (!$('#battle').hidden) return;                     // el combate se cierra con "Continuar"
    if (!$('#scr-game').hidden) { openMenu(); return; }  // en partida: abre el menú (la partida ya está guardada)
    P.minimize();                                         // en la elección de equipo: a segundo plano, sin cerrar
  }

  /* ---------- Arranque ---------- */
  function init() {
    P.onBack(onBack);
    document.querySelectorAll('#diff button').forEach(b => b.addEventListener('click', () => { ui.level = b.dataset.lv; renderTeam(); }));
    $('#btn-random').addEventListener('click', () => { ui.team = D.randomBalancedTeam(); renderTeam(); });
    $('#btn-play').addEventListener('click', () => { if (ui.team.length === 6) startGame(ui.team); });
    $('#btn-continue').addEventListener('click', () => { const sv = store.get(); if (sv && sv.state && Array.isArray(sv.state.figs) && sv.state.figs.length === 12 && !D.validate(sv.state).length) resumeGame(sv); else { store.del(); renderTeam(); } });
    $('#btn-rules-t').addEventListener('click', openRules);
    $('#btn-rules-g').addEventListener('click', openRules);
    $('#btn-guide-exit').addEventListener('click', requestExitTutorial);
    $('#btn-camp').addEventListener('click', () => window.DuelCampanaUI && window.DuelCampanaUI.abrir());
    $('#btn-menu').addEventListener('click', openMenu);
    $('#version-t').textContent = 'Versión ' + CFG.version + (feedbackUrl ? ' ·' : '');
    $('#btn-feedback-t').hidden = !feedbackUrl;
    $('#btn-feedback-t').addEventListener('click', openFeedback);
    ui.team = ['tizonaje', 'pulpiza', 'erizarza', 'tejonrock', 'zumbiza', 'musgoso'];
    renderTeam();
    P.hideSplash();
    offerTutorial();
  }
  window.DuelUI = {
    get state() { return ui.state; }, get busy() { return ui.busy; }, setFast(v) { ui.fast = v; },
    // solo lectura, para pruebas: lección y paso del tutorial en curso
    get guide() { return ui.guide && { lesson: ui.guide.lesson.id, step: ui.guide.i, done: ui.guide.done }; },
    get campaign() { return ui.campaign && ui.campaign.id; },
    // para campana-ui.js (misma interfaz, otro archivo)
    api: { openModal, closeModal, esc, creatureImg, typeIcon, showTeamScreen, hideScreens, startCampaignDuel, startCampaignGuided, nudge }
  };
  const start = () => P.restore([SAVE_KEY]).then(init);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
<script>
/* ===================== CAMPAÑA: INTERFAZ =====================
   Mapa de duelos, pantalla de diálogo, armado del equipo y exportar/importar progreso.
   La lógica de la campaña está en campana.js (sin DOM); las partidas las lanza ui.js
   (DuelUI.api.startCampaignDuel / startCampaignGuided) y avisan al terminar con onEnd(resultado).
   Retratos y fondos se cargan como archivos (art/web/...); si faltan, círculo con la inicial y fondo liso. */
(function () {
  'use strict';
  const C = window.DuelCampana, D = window.Duel, P = window.Platform;
  const U = window.DuelUI && window.DuelUI.api;
  if (!C || !U) return;
  const $ = s => document.querySelector(s);
  const esc = U.esc;
  let prog = null;
  let dlg = null; // diálogo abierto: { resolve, cola, ... }

  const cargar = () => { prog = C.leer(P.storage); return prog; };
  const guardar = () => C.guardar(P.storage, prog);
  // *texto* del guion -> cursiva
  const conCursiva = t => esc(t).replace(/\*(.+?)\*/g, '<em>$1</em>');

  /* ---------- Entrada ---------- */
  async function abrir() {
    if (!cargar()) {
      const v = await U.openModal('Campaña: el Gran Telar', '<p>Cinco épocas, catorce duelos y un telar por reparar. ¿Cómo te llamas?</p>' +
        '<input id="camp-nombre" class="campo" maxlength="16" autocomplete="off" value="Ari" aria-label="Tu nombre">' +
        '<p class="note">Por ahora están disponibles el prólogo y el Arco 1 (duelos 1 a 4).</p>',
        [{ label: 'Cancelar', value: null }, { label: 'Empezar', value: 'ok', primary: true }]);
      if (v !== 'ok') return;
      prog = C.nuevo($('#camp-nombre').value); guardar();
    }
    mapa();
  }

  /* ---------- Mapa ---------- */
  const ESTADO = { ganado: '✓ Ganado', abierto: 'Jugar', bloqueado: 'Bloqueado', proximamente: 'Próximamente' };
  function mini(id) {
    const per = C.personaje(id); const r = C.retrato(id, 'neutral');
    const ini = esc((C.conJugador(per.nombre, prog) || '?').trim().charAt(0).toUpperCase());
    return '<span class="mini" style="background:' + per.color + '">' + (r ? '<img src="' + r + '" alt="" data-ini="' + ini + '">' : ini) + '</span>';
  }
  function mapa() {
    U.hideScreens(); $('#scr-camp').hidden = false; window.scrollTo(0, 0);
    $('#camp-head').innerHTML = '<span>Tejedor/a: <b>' + esc(prog.jugador) + '</b></span><span>· Sellos <b>' + prog.sellos.length + '/5</b></span>' +
      (prog.figuras.length ? '<span>· Figuras</span><span class="figs">' + prog.figuras.map(k => U.creatureImg(D.CREATURE[k], 'token')).join('') + '</span>' : '');
    let html = '';
    C.CAMPANA.capitulos.forEach(cap => {
      const ds = C.DUELOS.filter(d => d.capitulo === cap.id);
      html += '<h2 class="camp-cap">' + esc(cap.titulo) + '</h2>';
      ds.forEach(d => {
        const e = C.estado(prog, d);
        html += '<button type="button" class="camp-duel ' + e + '" data-id="' + d.id + '"' + (e === 'ganado' || e === 'abierto' ? '' : ' disabled') + '>' +
          '<span class="num">' + d.num + '</span>' + mini(d.rival) +
          '<span class="tx"><b>' + esc(d.titulo) + (d.jefe ? ' · jefe' : '') + '</b>' + (d.subtitulo ? '<small>' + esc(d.subtitulo) + '</small>' : '') + '</span>' +
          '<span class="est">' + ESTADO[e] + '</span></button>';
      });
    });
    $('#camp-list').innerHTML = html;
    $('#camp-list').querySelectorAll('.camp-duel').forEach(b => b.addEventListener('click', () => jugar(C.duelo(b.dataset.id), false)));
  }

  /* ---------- Jugar un duelo ---------- */
  function contexto(id) {
    if (!prog) cargar();
    const d = C.duelo(id);
    return d && prog ? { id, onEnd: (r, motivo) => terminar(d, r, motivo) } : null;
  }
  async function jugar(d, reintento) {
    if (!reintento) await escenas(d.antes || [], d);
    if (d.aviso) await U.openModal(esc(d.titulo), '<p>' + esc(d.aviso) + '</p>', [{ label: 'Entendido', primary: true }]);
    if (d.guiado) { U.startCampaignGuided(C.guiado(d.guiado), contexto(d.id)); return; }
    const equipo = await elegirEquipo(d);
    if (!equipo) { mapa(); return; }
    U.startCampaignDuel(C.configDuelo(d), equipo, contexto(d.id));
  }
  async function terminar(d, r, motivo) {
    if (r === 'exit') { mapa(); return; }
    if (r === 'win') {
      const antes = prog.figuras.slice();
      prog = C.ganar(prog, d.id); guardar();
      await escenas(d.despues || [], d);
      const nuevas = prog.figuras.filter(k => !antes.includes(k));
      const rec = d.recompensa || {};
      await U.openModal('¡Ganaste a ' + esc(C.conJugador(C.personaje(d.rival).nombre, prog)) + '!',
        '<p><b>Recompensa:</b> ' + esc(rec.texto || '—') + '</p>' +
        (nuevas.length ? '<div class="camp-head"><span class="figs">' + nuevas.map(k => U.creatureImg(D.CREATURE[k], 'token')).join('') + '</span><span>' + nuevas.map(k => esc(D.CREATURE[k].name)).join(', ') + '</span></div>' : '') +
        (C.siguiente(prog) ? '' : '<p class="note">Por ahora la campaña llega hasta aquí: el Arco 2 viene en la próxima versión.</p>'),
        [{ label: 'Al mapa', primary: true }]);
      mapa(); return;
    }
    if (d.reintento) await escenas([d.reintento], d);
    const v = await U.openModal(r === 'draw' ? 'Empate' : 'Perdiste', '<p>' + esc(motivo || '') + '</p>',
      [{ label: 'Al mapa', value: 'mapa' }, { label: 'Reintentar', value: 'otra', primary: true }]);
    if (v === 'otra') jugar(d, true); else mapa();
  }

  /* ---------- Equipo (6 figuras de las desbloqueadas; se pueden repetir) ---------- */
  async function elegirEquipo(d) {
    let eq = C.equipoPorDefecto(prog);
    const pintar = () => {
      $('#modal-body').innerHTML = '<p>Arma tu equipo de 6 con tus figuras. Puedes repetir. Toca una ranura para vaciarla.</p>' +
        '<div class="equipo-slots">' + Array.from({ length: C.TAM_EQUIPO }, (_, i) => eq[i]
          ? '<button type="button" class="lleno" data-i="' + i + '" aria-label="Quitar ' + esc(D.CREATURE[eq[i]].name) + '">' + U.creatureImg(D.CREATURE[eq[i]], 'token') + '</button>'
          : '<button type="button" data-i="' + i + '" aria-label="Ranura vacía"></button>').join('') + '</div>' +
        '<div class="equipo-pool">' + prog.figuras.map(k => '<button type="button" data-k="' + k + '" aria-label="Agregar ' + esc(D.CREATURE[k].name) + '">' + U.creatureImg(D.CREATURE[k], 'token') + '</button>').join('') + '</div>';
      $('#modal-body').querySelectorAll('.equipo-slots button').forEach(b => b.addEventListener('click', () => { eq.splice(+b.dataset.i, 1); pintar(); }));
      $('#modal-body').querySelectorAll('.equipo-pool button').forEach(b => b.addEventListener('click', () => { if (eq.length < C.TAM_EQUIPO) { eq.push(b.dataset.k); pintar(); } else U.nudge(); }));
      const jugarBtn = [...document.querySelectorAll('#modal-actions .btn')].find(x => x.textContent === 'Jugar');
      if (jugarBtn) jugarBtn.disabled = eq.length !== C.TAM_EQUIPO;
    };
    const p = U.openModal('Tu equipo contra ' + esc(C.conJugador(C.personaje(d.rival).nombre, prog)), '', [{ label: 'Cancelar', value: null }, { label: 'Jugar', value: 'ok', primary: true }]);
    pintar();
    const v = await p;
    if (v !== 'ok' || !C.equipoValido(eq, prog)) return null;
    prog.equipo = eq.slice(); guardar();
    return eq;
  }

  /* ---------- Diálogo ---------- */
  async function escenas(ids, d) {
    for (const id of ids) await dialogo(C.escena(id, d, prog));
  }
  function dialogo(e) {
    return new Promise(resolve => {
      const cola = [];
      if (e.escenario) cola.push({ narracion: true, texto: e.escenario, quien: 'narracion' });
      e.lineas.forEach(l => cola.push(l));
      dlg = { resolve, cola, i: -1, esperando: false };
      const el = $('#dialogo'); el.hidden = false;
      const fondo = el.querySelector('.dlg-fondo');
      fondo.style.backgroundImage = '';
      if (e.fondo) { const img = new Image(); img.onload = () => { fondo.style.backgroundImage = 'url("' + e.fondo + '")'; }; img.src = e.fondo; }
      el.querySelector('.dlg-escena').textContent = e.titulo;
      avanzar();
    });
  }
  function mostrar(l) {
    const el = $('#dialogo');
    const caja = el.querySelector('.dlg-caja'), ret = el.querySelector('.dlg-retrato');
    caja.className = 'dlg-caja ' + (l.narracion ? 'narr' : (l.lado || 'der'));
    ret.className = 'dlg-retrato ' + (l.lado || 'der');
    const nom = el.querySelector('.dlg-nombre');
    nom.hidden = !!l.narracion || !l.nombre;
    nom.textContent = l.nombre || ''; nom.style.color = l.color || '';
    if (l.narracion) ret.innerHTML = '';
    else if (l.retrato) {
      ret.innerHTML = '<img alt="" src="' + l.retrato + '">';
      ret.querySelector('img').addEventListener('error', () => { ret.innerHTML = inicial(l); });
    } else ret.innerHTML = inicial(l);
    el.querySelector('.dlg-accion').innerHTML = l.accion ? '(' + conCursiva(l.accion) + ')' : '';
    el.querySelector('.dlg-texto').innerHTML = conCursiva(l.texto || '');
    const ops = el.querySelector('.dlg-opciones'); ops.innerHTML = '';
    el.querySelector('.dlg-sigue').hidden = !!l.opciones;
    if (l.opciones) {
      dlg.esperando = true;
      l.opciones.forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = o.texto;
        b.addEventListener('click', ev => { ev.stopPropagation(); dlg.esperando = false; dlg.cola.splice(dlg.i + 1, 0, o.respuesta); avanzar(); });
        ops.appendChild(b);
      });
    }
  }
  function inicial(l) {
    return '<span class="ini" style="background:' + (l.color || '#9ba6c9') + '">' + esc((l.nombre || '?').trim().charAt(0).toUpperCase()) + '</span>';
  }
  function avanzar() {
    if (!dlg || dlg.esperando) return;
    dlg.i++;
    if (dlg.i >= dlg.cola.length) { cerrarDialogo(); return; }
    mostrar(dlg.cola[dlg.i]);
  }
  function cerrarDialogo() {
    if (!dlg) return;
    const r = dlg.resolve; dlg = null;
    $('#dialogo').hidden = true;
    r();
  }

  /* ---------- Opciones: exportar, importar, borrar ---------- */
  async function opciones() {
    const v = await U.openModal('Progreso de campaña', '<p>Tu avance se guarda en este navegador. Para no perderlo (o pasarlo a otro teléfono), copia el código y guárdalo.</p>',
      [{ label: 'Exportar', value: 'exp' }, { label: 'Importar', value: 'imp' }, { label: 'Borrar', value: 'del', danger: true }, { label: 'Cerrar', value: null, primary: true }]);
    if (v === 'exp') {
      const code = C.exportar(prog);
      const p = U.openModal('Exportar progreso', '<p>Copia este código y guárdalo donde quieras (un mensaje, una nota).</p><textarea id="camp-code" class="codigo" readonly>' + esc(code) + '</textarea>',
        [{ label: 'Copiar', keep: true, onClick: copiar }, { label: 'Listo', primary: true }]);
      await p;
    } else if (v === 'imp') {
      const r = await U.openModal('Importar progreso', '<p>Pega el código. Reemplaza el progreso de este navegador.</p><textarea id="camp-code" class="codigo" spellcheck="false" placeholder="HT1...."></textarea><p id="camp-err" class="warn"></p>',
        [{ label: 'Cancelar', value: null }, { label: 'Importar', value: 'ok', primary: true }]);
      if (r === 'ok') {
        try { prog = C.importar($('#camp-code').value); guardar(); await U.openModal('Listo', '<p>Progreso de <b>' + esc(prog.jugador) + '</b> importado: ' + prog.ganados.length + ' duelos ganados.</p>'); }
        catch (e) { await U.openModal('No se pudo importar', '<p>' + esc(e.message) + '</p>'); }
      }
    } else if (v === 'del') {
      const r = await U.openModal('¿Borrar la campaña?', '<p>Se pierde el avance de este navegador (exporta antes si quieres conservarlo).</p>', [{ label: 'Cancelar', value: null }, { label: 'Borrar', value: 'ok', danger: true }]);
      if (r === 'ok') { P.storage.del(C.KEY); prog = null; U.showTeamScreen(); return; }
    }
    if (prog) mapa();
  }
  function copiar() {
    const t = $('#camp-code'); if (!t) return;
    const ok = () => { const b = [...document.querySelectorAll('#modal-actions .btn')].find(x => x.textContent.startsWith('Copiar')); if (b) b.textContent = 'Copiado ✓'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(ok, () => { t.select(); });
    else { t.select(); try { document.execCommand('copy'); ok(); } catch (e) { /* seleccionado para copiar a mano */ } }
  }

  // Botón atrás (Android): salta la escena o vuelve del mapa a la pantalla inicial
  function onBack() {
    if (dlg) { cerrarDialogo(); return true; }
    if (!$('#scr-camp').hidden) { U.showTeamScreen(); return true; }
    return false;
  }

  function init() {
    const el = $('#dialogo');
    el.addEventListener('click', ev => { if (ev.target.closest('.dlg-opciones')) return; avanzar(); });
    el.querySelector('.dlg-saltar').addEventListener('click', ev => { ev.stopPropagation(); cerrarDialogo(); });
    $('#btn-camp-back').addEventListener('click', () => U.showTeamScreen());
    $('#btn-camp-menu').addEventListener('click', opciones);
    // retrato pequeño del mapa que no carga: inicial
    document.addEventListener('error', ev => {
      const t = ev.target;
      if (t && t.tagName === 'IMG' && t.dataset.ini !== undefined && t.parentElement && t.parentElement.classList.contains('mini')) t.parentElement.textContent = t.dataset.ini;
    }, true);
  }

  window.DuelCampanaUI = { abrir, contexto, onBack, get abierto() { return !!dlg; } };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
